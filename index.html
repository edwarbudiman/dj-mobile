<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17181a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DJ Mobile">
  <meta name="description" content="Two decks, scratching, a mixer and beat sync. Your music stays on your device.">
  <title>DJ Mobile</title>
  <!-- every URL here is relative: the app is hosted under a sub-path (https://edwarbudiman.github.io/dj-mobile/) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="perform" class="perform">
    <header class="topbar">
      <span class="brand">DJ Mobile</span>
      <div id="rotate-hint" class="rotate-hint">
        <span>Landscape gives you the full layout</span>
        <button type="button" id="rotate-dismiss" class="btn-x" aria-label="Dismiss">✕</button>
      </div>
      <button type="button" id="btn-library" class="btn btn-lib">Library</button>
    </header>
    <main class="stage">
      <section id="deck-a" class="deck" aria-label="Deck A"></section>
      <section id="mixer" class="mixer" aria-label="Mixer"></section>
      <section id="deck-b" class="deck" aria-label="Deck B"></section>
    </main>
  </div>

  <aside id="library" class="sheet" hidden></aside>
  <aside id="confirm" class="sheet sheet-confirm" hidden></aside>

  <!-- shown when a new version of the app has been downloaded and is waiting (js/pwa.js) -->
  <div id="update-bar" class="update-bar" hidden>
    <button type="button" id="update-reload" class="btn btn-update">Update ready: tap to reload</button>
    <button type="button" id="update-later" class="btn btn-x" aria-label="Not now">✕</button>
  </div>

  <div id="start-overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="start-title">DJ Mobile</h1>
      <p id="start-msg"></p>
      <button type="button" id="start-btn" class="btn btn-start">Tap to start</button>
      <noscript><p>This app needs JavaScript.</p></noscript>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" accept="audio/*" multiple hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
